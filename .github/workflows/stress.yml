name: Stress

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-server-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Pull nats-server image
        run: |
          set -euo pipefail

          for i in {1..5}; do
            if docker pull nats:2.11-alpine; then
              exit 0
            fi
            if [ "${i}" -eq 5 ]; then
              exit 1
            fi
            sleep $((i * 10))
          done
      - run: docker run -d --name nats -p 4222:4222 nats:2.11-alpine -js
      - run: |
          set -euo pipefail
          ready=false
          for i in {1..30}; do
            if nc -z 127.0.0.1 4222; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "${ready}" != "true" ]; then
            if docker inspect nats >/dev/null 2>&1; then
              docker logs nats || true
            fi
            exit 1
          fi
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
        env:
          NATTER_RUN_INTEGRATION: 'true'
          NATTER_RUN_JETSTREAM: 'true'
          NATTER_RUN_STRESS: 'true'
          NATTER_INTEGRATION_TIMEOUT: '10.0'
          NATTER_STRESS_SECONDS: '45.0'
          NATTER_STRESS_KEYS: '2000'
          NATTER_STRESS_WATCHERS: '4'
      - name: Show nats logs
        if: failure()
        run: |
          if docker inspect nats >/dev/null 2>&1; then
            docker logs nats || true
          fi
      - name: Stop nats
        if: always()
        run: docker rm -f nats >/dev/null 2>&1 || true
