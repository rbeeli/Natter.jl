name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'

jobs:
  live-server-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - run: docker run -d --name nats -p 4222:4222 nats:2.11 -js
      - run: |
          set -euo pipefail
          ready=false
          for i in {1..30}; do
            if nc -z 127.0.0.1 4222; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "${ready}" != "true" ]; then
            docker logs nats
            exit 1
          fi
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: |
          set -euo pipefail
          mkdir -p perf-artifacts
          trials="${NATTER_BENCH_TRIALS:-7}"
          julia_flags="${NATTER_BENCH_JULIA_FLAGS:-}"
          if [ -z "${julia_flags}" ]; then
            julia_flags="--startup-file=no -O3 --check-bounds=no -C native"
          fi
          for i in $(seq 1 "${trials}"); do
            NATTER_BENCH_JULIA_FLAGS="${julia_flags}" NATTER_BENCH_NATS_IMAGE="nats:2.11" \
              julia ${julia_flags} --project=. benchmarks/run.jl \
                --url nats://127.0.0.1:4222 \
                --messages "${NATTER_BENCH_MESSAGES:-200000}" \
                --requests "${NATTER_BENCH_REQUESTS:-20000}" \
                --payload-bytes 64 \
                --concurrency 4 \
                --timeout "${NATTER_BENCH_TIMEOUT:-90}" \
                --alloc-iterations "${NATTER_BENCH_ALLOC_ITERATIONS:-10000}" \
                --output "perf-artifacts/performance-trial-${i}.md" \
                --json "perf-artifacts/performance-trial-${i}.json"
          done
          julia --project=. benchmarks/aggregate_median.jl \
            --client natter \
            --output perf-artifacts/performance.json \
            -- perf-artifacts/performance-trial-*.json
        env:
          JULIA_NUM_THREADS: '2'
          NATTER_BENCH_TRIALS: '7'
          NATTER_BENCH_MESSAGES: '200000'
          NATTER_BENCH_REQUESTS: '20000'
          NATTER_BENCH_TIMEOUT: '90'
          NATTER_BENCH_ALLOC_ITERATIONS: '10000'
          NATTER_BENCH_JULIA_FLAGS: '--startup-file=no -O3 --check-bounds=no -C native'
      - run: cat perf-artifacts/performance.json >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natter-performance-report
          path: perf-artifacts/
          if-no-files-found: ignore
      - if: failure()
        run: docker logs nats
